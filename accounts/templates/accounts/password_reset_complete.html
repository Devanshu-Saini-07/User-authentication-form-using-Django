{% extends "base.html" %}

{% block title %}Password Reset Complete | Django User Authentication{% endblock %}

{% block content %}
<section class="content-card narrow-card text-center">
    <span class="eyebrow">All Set</span>
    <h1 class="h2 fw-bold mt-2">Your password has been reset</h1>
    <p class="text-secondary">You can now sign in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">Back to Login</a>
</section>
{% endblock %}
