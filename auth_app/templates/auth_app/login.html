{% extends 'base.html' %}
{% block content %}
<h2>Login</h2>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p><a href="{% url 'auth_app:password_reset' %}">Forgot password?</a></p>
</div>
{% endblock %}
