<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Auth App</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .nav { margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        .nav a { margin-right: 15px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="nav">
        {% if user.is_authenticated %}
            <a href="{% url 'auth_app:dashboard' %}">Dashboard</a>
            <a href="{% url 'auth_app:profile' %}">Profile</a>
            <a href="{% url 'auth_app:logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'auth_app:login' %}">Login</a>
            <a href="{% url 'auth_app:register' %}">Register</a>
        {% endif %}
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</body>
</html>
